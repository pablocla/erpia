name: Verify

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run unit tests
        run: npm run test

      - name: Audit API guards (P0 config routes)
        run: node scripts/audit-api-guards.mjs

      - name: Sprint 3-7 targeted tests
        run: npx vitest run __tests__/ops/relevamiento-handoff.test.ts __tests__/nicho/formula-apu.test.ts __tests__/consorcios/consorcios-liquidacion.test.ts __tests__/comercial/go-to-market-vitrine.test.ts

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          JWT_SECRET: ci-jwt-secret-min-32-chars-long
          NEXTAUTH_SECRET: ci-nextauth-secret-min-32-chars